apiVersion: v1
kind: Pod
metadata:
  name: my-web-server
spec:
  containers:
  - name: web-server
    image: nginx:latest
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
